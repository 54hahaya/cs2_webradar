# GitHub Pages 自动部署
#
# 放置位置二选一：
#   A) 仓库根目录 = webradar/ 这一层   -> 直接用本文件，无需改动
#   B) webradar 是仓库里的子目录       -> 取消下面 defaults 注释，并把 path 改成 webradar/dist
name: Deploy web-radar to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: webradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll: 让 Pages 跳过 Jekyll 处理（否则下划线开头的文件/目录会被吞）
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
